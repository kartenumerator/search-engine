
services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - ../redis.conf:/usr/local/etc/redis/redis.conf
      # Mount your local dump file into the Redis working directory
      - ../data:/data
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    networks:
     - query_network
    restart: always
  
  api:
    build: .
    depends_on:
      - redis
    expose:
      - "3333"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MONGO_HOST: host.docker.internal
      MONGO_PORT: 27017
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GEMINI_API: AIzaSyBwkc9qLHCJhYYF6rYK5A0al5r7VQ0Z_qE
      ENVIRONMENT: production
    
    healthcheck:
      test: ["CMD", "python3", "/app/healthcheck.py"]  
      interval: 30s
      timeout: 3s
      retries: 5
    networks:
     - query_network
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api :
        condition : service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/ssl/cloudlfare:/etc/ssl/cloudflare
    networks:
     - query_network
    restart: always

networks:
  query_network:
    driver: bridge
